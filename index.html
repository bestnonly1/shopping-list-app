<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑리스트</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #8a94a0;
      --line: #e4e8ec;
      --accent: #2f9e6e;
      --accent-dark: #25805a;
      --danger: #d64545;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 28px 24px;
      align-self: flex-start;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .summary {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
    }

    input[type="text"]:focus { border-color: var(--accent); }

    .add-btn {
      padding: 0 18px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .add-btn:hover { background: var(--accent-dark); }
    .add-btn:disabled { opacity: 0.5; cursor: default; background: var(--accent); }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--line);
    }

    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    li .name {
      flex: 1;
      font-size: 16px;
      word-break: break-word;
    }

    li.done .name {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete-btn {
      width: 32px;
      height: 32px;
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: #fdecec;
    }

    .empty {
      padding: 32px 0;
      text-align: center;
      color: var(--muted);
    }

    .clear-btn {
      margin-top: 16px;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
    }

    .clear-btn:hover { color: var(--danger); border-color: var(--danger); }

    .error {
      margin: 0 0 16px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--danger);
      background: #fdecec;
      border-radius: 8px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"
    integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz"
    crossorigin="anonymous"></script>
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑리스트</h1>
    <p class="summary" id="summary"></p>
    <p class="error" id="error" role="alert" hidden></p>

    <form id="add-form">
      <input type="text" id="item-input" placeholder="살 것을 입력하세요" maxlength="100" autocomplete="off" autofocus>
      <button type="submit" class="add-btn">추가</button>
    </form>

    <ul id="item-list"></ul>
    <p class="empty" id="empty">목록이 비어 있어요.</p>
    <button type="button" class="clear-btn" id="clear-done" hidden>완료한 항목 지우기</button>
  </main>

  <script>
    // 공개(publishable) 키라 코드에 넣어도 된다. 접근 범위는 DB의 RLS 정책이 정한다.
    const SUPABASE_URL = 'https://gbwtqkgzqwitbekdkwyb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_A-qDbbwtjSN3yx1z6b6wJA_ymVIiPWw';
    const TABLE = 'shopping_items';
    // 예전 버전이 쓰던 localStorage 키. 남아 있는 데이터는 처음 한 번 DB로 옮긴다.
    const LEGACY_STORAGE_KEY = 'shopping-list';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('add-form');
    const input = document.getElementById('item-input');
    const addBtn = form.querySelector('.add-btn');
    const list = document.getElementById('item-list');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('summary');
    const errorBox = document.getElementById('error');
    const clearDoneBtn = document.getElementById('clear-done');

    let items = [];
    let loading = true;

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = !message;
    }

    // 생성 순서대로 보여 준다. 같은 시각에 들어간 행은 id(타임스탬프로 시작)로 순서를 맞춘다.
    async function loadItems() {
      const { data, error } = await db
        .from(TABLE)
        .select('id, name, done')
        .order('created_at')
        .order('id');
      if (error) throw error;
      return data;
    }

    async function migrateLegacyItems() {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY));
      } catch {
        return;
      }
      if (!Array.isArray(saved) || saved.length === 0) return;

      const rows = saved
        .filter((it) => it && typeof it.id === 'string' && typeof it.name === 'string' && it.name.trim())
        .map((it) => ({ id: it.id, name: it.name.trim().slice(0, 100), done: Boolean(it.done) }));

      if (rows.length > 0) {
        const { error } = await db.from(TABLE).upsert(rows, { onConflict: 'id', ignoreDuplicates: true });
        if (error) throw error;
      }
      try {
        localStorage.removeItem(LEGACY_STORAGE_KEY);
      } catch {
        // 지우지 못해도 upsert가 중복을 무시하므로 다음에 다시 시도해도 안전하다.
      }
    }

    // 화면을 먼저 바꾸고(낙관적 업데이트) DB에 반영한다. 실패하면 DB 상태로 되돌린다.
    async function sync(request) {
      showError('');
      render();
      const { error } = await request;
      if (!error) return;
      showError('저장하지 못했어요. 인터넷 연결을 확인해 주세요.');
      await refresh();
    }

    async function refresh() {
      try {
        items = await loadItems();
      } catch {
        showError('목록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
      }
      loading = false;
      render();
    }

    function render() {
      list.replaceChildren();

      for (const item of items) {
        const li = document.createElement('li');
        li.classList.toggle('done', item.done);

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.done;
        checkbox.setAttribute('aria-label', `${item.name} 구매 완료`);
        checkbox.addEventListener('change', () => toggleItem(item.id));

        // 사용자 입력은 textContent로만 넣어 HTML로 해석되지 않게 한다.
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = item.name;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.setAttribute('aria-label', `${item.name} 삭제`);
        deleteBtn.addEventListener('click', () => deleteItem(item.id));

        li.append(checkbox, name, deleteBtn);
        list.append(li);
      }

      const doneCount = items.filter((item) => item.done).length;
      empty.hidden = loading || items.length > 0;
      // 불러오기 전에 추가하면 불러온 목록이 덮어쓸 수 있어 잠시 막는다.
      addBtn.disabled = loading;
      clearDoneBtn.hidden = doneCount === 0;
      if (loading) {
        summary.textContent = '불러오는 중…';
      } else {
        summary.textContent = items.length === 0
          ? '살 것을 추가해 보세요.'
          : `전체 ${items.length}개 · 남은 것 ${items.length - doneCount}개`;
      }
    }

    function addItem(name) {
      const id = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      items.push({ id, name, done: false });
      sync(db.from(TABLE).insert({ id, name, done: false }));
    }

    function toggleItem(id) {
      const item = items.find((it) => it.id === id);
      if (!item) return;
      item.done = !item.done;
      sync(db.from(TABLE).update({ done: item.done }).eq('id', id));
    }

    function deleteItem(id) {
      items = items.filter((it) => it.id !== id);
      sync(db.from(TABLE).delete().eq('id', id));
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) return;
      addItem(name);
      input.value = '';
      input.focus();
    });

    clearDoneBtn.addEventListener('click', () => {
      const doneIds = items.filter((it) => it.done).map((it) => it.id);
      items = items.filter((it) => !it.done);
      sync(db.from(TABLE).delete().in('id', doneIds));
    });

    render();
    migrateLegacyItems()
      .catch(() => showError('예전 목록을 옮기지 못했어요. 새로고침하면 다시 시도해요.'))
      .finally(refresh);
  </script>
</body>
</html>
